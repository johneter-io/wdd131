<!DOCTYPE html>
<html lang="en">

<head>
    <title>Product Review Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="John Peter Jospeh">
    <meta name="description"
        content="Rate and review your product. Share your experience and help others make smarter buying decisions.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <div class="group">
                <label for="product" class="title">Product Name</label>

                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a product ...</option>
                </select>
            </div>

            <div class="group">
                <div>
                    <label class="title">Overall Rating</label>
                </div>

                <div class="allrating">
                    <div>
                        <label for="rating1">☆</label>
                        <input type="radio" name="rating" id="rating1" value="1" required>
                    </div>

                    <div>
                        <label for="rating2">☆☆</label>
                        <input type="radio" name="rating" id="rating2" value="2" required>
                    </div>

                    <div>
                        <label for="rating3">☆☆☆</label>
                        <input type="radio" name="rating" id="rating3" value="3" required>
                    </div>

                    <div>
                        <label for="rating4">☆☆☆☆</label>
                        <input type="radio" name="rating" id="rating4" value="4" required>
                    </div>

                    <div>
                        <label for="rating5">☆☆☆☆☆</label>
                        <input type="radio" name="rating" id="rating5" value="5" required>
                    </div>
                </div>
            </div>

            <div class="group">
                <label for="installDate" class="title">Date of Installation</label>
                <input type="date" name="date" id="installDate">
            </div>

            <div class="group">
                <div>
                    <label class="title">Which features did you find useful in the product? <br />
                        <span class="apply">(Check all that apply)</span>
                    </label>
                </div>
                <div>
                    <input type="checkbox" name="feature" id="durability" value="durability">
                    <label for="durability">Durability</label>
                </div>
                <div>
                    <input type="checkbox" name="feature" id="ease" value="easeofuse">
                    <label for="ease">Ease of Use</label>
                </div>
                <div>
                    <input type="checkbox" name="feature" id="performance" value="performance">
                    <label for="performance">Performance</label>
                </div>
                <div>
                    <input type="checkbox" name="feature" id="design" value="design">
                    <label for="design">Design</label>
                </div>
            </div>

            <div class="group">
                <label for="written-review" class="title">Written Review <span
                        class="optional">(optional)</span></label>
                <textarea name="written-review" id="written-review" cols="50" rows="10"></textarea>
            </div>

            <div class="group">
                <label for="yourname" class="title">Your Name <span class="optional">(optional)</span></label>
                <input type="text" name="yourname" id="yourname">
            </div>

            <button type="submit" class="bton">Post Review</button>
        </form>
    </main>

    <footer>
        <p>&#169; <span id="currentyear"></span> &bull; John Peter Joseph &bull; Haïti</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
