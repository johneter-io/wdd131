<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextCraft - Contact Us</title>
    <meta name="author" content="John Peter Joseph">
    <meta name="description"
        content="Need help getting ready for tomorrow? Please let us know. We're here to help you move forward with confidence.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/nextcraft.css">
    <link rel="stylesheet" href="styles/nextcraft-large.css">

    <script src="scripts/nextcraft.js" defer></script>
</head>

<body class="page-contact">
    <!-- ======================================= HEADER ======================================= -->
    <header id="header">
        <div class="main-header">
            <div class="nexcraft-logo">
                <a href="index.html">
                    <img src="images/nextcraft-logo.svg" alt="NextCraft Logo">
                </a>
                <h1>NextCraft</h1>
            </div>

            <!-- hamburger button -->
            <button class="hamburger" id="hamburger" aria-label="Open menu">
                ☰
            </button>

            <nav class="nav-bar" id="nav-bar">
                <a href="index.html">
                    <img src="images/nextcraft-home.svg" alt="NextCraft Home">
                </a>
                <ul>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <!-- ======================================= MAIN ======================================= -->
    <main>
        <div class="main-contact">
            <section class="contact-section">

                <div class="contact-intro">
                    <h2>Let's stay in touch.</h2>
                    <p>Whether you have a question, a suggestion, or just want to follow NextCraft's journey, we'd love
                        to
                        hear from you.</p>
                </div>

                <form action="" method="post" class="contact-form">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="johndoe@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Select a subject</option>
                            <option value="general">General inquiry</option>
                            <option value="skills">Skills</option>
                            <option value="partnership">Partnership</option>
                            <option value="feedback">Feedback</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Tell us what you have in mind..."
                            required></textarea>
                    </div>

                    <button type="submit" class="contact-btn">Send Message</button>

                </form>
            </section>
        </div>
    </main>

    <!-- ======================================= FOOTER ======================================= -->
    <footer>
        <div class="footer-block">
            <div class="form-contact">
                <div class="footer-logo">
                    <a href="#">
                        <img src="images/nextcraft-logo.svg" alt="NextCraft Home">
                    </a>
                </div>
                <div class="footer-contact">
                    <div>
                        <form action="" method="post">
                            <label for="email-footer"><span class="arobase">@</span></label>
                            <input type="email" name="email" id="email-footer" placeholder="johndoe@email.com" required>
                            <button type="submit">Stay In Touch</button>
                        </form>
                    </div>
                    <div>
                        <a href="#"><img src="images/icons/github.svg" alt="GitHub icon"></a>
                        <a href="#"><img src="images/icons/x.svg" alt="X icon"></a>
                        <a href="#"><img src="images/icons/youtube.svg" alt="YouTube icon"></a>
                    </div>
                </div>
            </div>
            <div class="up-btn">
                <a href="#top" aria-label="Back to the top of the page">
                    <img src="images/arrow-up.svg" alt="">
                </a>
            </div>
        </div>
        <div class="last-mod">
            <p>&#169; <span id="currentYear"></span> &bull; John Peter Joseph &bull; Haïti</p>
            <p id="lastModified"></p>
        </div>
    </footer>

</body>

</html>
